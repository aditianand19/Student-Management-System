
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
            color: #263445;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
            padding: 14px;
            border-radius: 6px;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 22px;
            border-radius: 10px;
            background: #eff6ff;
            border-left: 5px solid #2563eb;
        }

        .stat-card:nth-child(2) {
            background: #f0fdf4;
            border-left-color: #16a34a;
        }

        .stat-card p {
            color: #64748b;
            font-weight: bold;
        }

        .stat-card h2 {
            margin: 0;
            font-size: 30px;
        }

        .filter-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .filter-section h3 {
            margin-top: 0;
        }

        .filter-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        input, select {
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            min-width: 150px;
        }

        input:focus, select:focus {
            border-color: #2563eb;
        }

        button, .add-btn, .clear-btn {
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            color: white;
            background: #2563eb;
            cursor: pointer;
            text-decoration: none;
        }

        .add-btn {
            background: #16a34a;
        }

        .clear-btn {
            background: #64748b;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #263445;
            color: white;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .edit {
            background: #2563eb;
            text-decoration: none;
            color: white;
            padding: 8px 11px;
            border-radius: 5px;
            display: inline-block;
        }

        .delete {
            background: #dc2626;
            padding: 8px 11px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .pagination a {
            padding: 9px 14px;
            background: #e5e7eb;
            color: #263445;
            text-decoration: none;
            border-radius: 5px;
        }

        .pagination a.active {
            background: #2563eb;
            color: white;
        }

        .pagination a.disabled {
            pointer-events: none;
            opacity: 0.4;
        }

        .info {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
        }

        .bottom-bar {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        @media (max-width: 650px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .filter-form {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-form input,
            .filter-form select,
            .filter-form button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <p class="subtitle">
        Manage your students and academic records
    </p>

    <div class="success-message"
         th:if="${successMessage != null}"
         th:text="${successMessage}">
    </div>

    <!-- Dashboard Statistics -->

    <div class="stats">

        <div class="stat-card">
            <p>Total Students (Current Results)</p>
            <h2 th:text="${totalItems}">0</h2>
        </div>

        <div class="stat-card">
            <p>Total Courses</p>
            <h2 th:text="${totalCourses}">0</h2>
        </div>

    </div>

    <!-- Search, Course Filter and Sorting -->

    <div class="filter-section">

        <h3>Search and Filter Students</h3>

        <form action="/filter" method="get" class="filter-form">

            <input type="text"
                   name="name"
                   placeholder="Search by student name"
                   th:value="${name}">

            <select name="course">
                <option value="">All Courses</option>

                <option th:each="c : ${courses}"
                        th:value="${c}"
                        th:text="${c}"
                        th:selected="${course == c}">
                </option>
            </select>

            <select name="sortBy">
                <option value="id" th:selected="${sortBy == 'id'}">
                    Sort by ID
                </option>

                <option value="name" th:selected="${sortBy == 'name'}">
                    Sort by Name
                </option>

                <option value="email" th:selected="${sortBy == 'email'}">
                    Sort by Email
                </option>

                <option value="course" th:selected="${sortBy == 'course'}">
                    Sort by Course
                </option>
            </select>

            <select name="direction">
                <option value="asc"
                        th:selected="${direction == 'asc'}">
                    Ascending
                </option>

                <option value="desc"
                        th:selected="${direction == 'desc'}">
                    Descending
                </option>
            </select>

            <input type="hidden" name="page" value="0">
            <input type="hidden" name="size" value="5">

            <button type="submit">Apply Filters</button>

        </form>

    </div>

    <!-- Student Table -->

    <div class="table-wrapper">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="student : ${students}">

                <td th:text="${student.id}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.email}"></td>
                <td th:text="${student.course}"></td>

                <td>

                    <a th:href="@{/edit/{id}(id=${student.id})}"
                       class="edit">
                        Edit
                    </a>

                    <form th:action="@{/delete/{id}(id=${student.id})}"
                          method="post"
                          style="display:inline"
                          onsubmit="return confirm('Are you sure you want to delete this student?');">

                        <button type="submit" class="delete">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(students)}">
                <td colspan="5" class="empty">
                    No students found.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

    <!-- Student Information -->

    <div class="info">
        Showing
        <strong th:text="${students.size()}"></strong>
        students on this page.
    </div>

    <!-- Pagination -->

    <div class="pagination"
         th:if="${totalPages != null and totalPages > 1}">

        <a th:href="@{/filter(
                name=${name},
                course=${course},
                page=${currentPage - 1},
                size=5,
                sortBy=${sortBy},
                direction=${direction})}"
           th:classappend="${currentPage == 0} ? 'disabled' : ''">
            Previous
        </a>

        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/filter(
                name=${name},
                course=${course},
                page=${i},
                size=5,
                sortBy=${sortBy},
                direction=${direction})}"
           th:text="${i + 1}"
           th:classappend="${currentPage == i} ? 'active' : ''">
        </a>

        <a th:href="@{/filter(
                name=${name},
                course=${course},
                page=${currentPage + 1},
                size=5,
                sortBy=${sortBy},
                direction=${direction})}"
           th:classappend="${currentPage + 1 >= totalPages} ? 'disabled' : ''">
            Next
        </a>

    </div>

    <!-- Bottom Actions -->

    <div class="bottom-bar">

        <a href="/" class="clear-btn">
            Clear Filters
        </a>

        <a href="/add" class="add-btn">
            + Add Student
        </a>

    </div>

</div>

</body>
</html>
